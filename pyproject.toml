[project]
name = "cs-voice"
version = "0.1.0"
description = "Voice support agent for Orbio"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[cartesia,deepgram,elevenlabs,google,openai,silero]~=1.6",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "python-dotenv~=1.0",
    "torch>=2.12.1",
]

[project.scripts]
cs-voice = "cs_voice.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_voice"]

[dependency-groups]
dev = [
    "mypy~=1.0",
    "pytest~=8.0",
    "pytest-asyncio~=0.24",
    "ruff~=0.8",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not eval'"  # behavioral evals are opt-in: `pytest -m eval`
markers = [
    "eval: LLM-driven behavioral evals; needs OPENAI_API_KEY, costs tokens (run with -m eval)",
]
asyncio_mode = "auto"
# pytest-asyncio 0.24 trips Python 3.14's event-loop-policy deprecation; not our code
filterwarnings = ["ignore:'asyncio.[gs]et_event_loop_policy':DeprecationWarning"]

[tool.mypy]
files = ["src/cs_voice"]
strict = true
ignore_missing_imports = true
